name: Deploy KDP Studio to Vercel

on:
  workflow_dispatch:
  push:
    branches: [claude/kdp-colouring-book-studio-1s7szl]
    paths: ["kdp-studio/**"]

concurrency:
  group: vercel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kdp-studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing repository secret VERCEL_TOKEN (create at vercel.com/account/tokens)"; exit 1
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing repository secret DATABASE_URL (Neon connection string)"; exit 1
          fi

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Link (or create) Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel link --yes --project kdp-studio --token "$VERCEL_TOKEN"

      - name: Sync environment variables to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Accept either secret name; the app itself always reads OPENAI_API_KEY
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPEN_AI_API }}
          # Optional Cloudflare R2 storage (10GB free tier). When all five are
          # set the app stores artwork in R2 instead of Vercel Blob.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          # Optional: enables the live Etsy market scan in the Niche Finder.
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          # Optional: automatic OneDrive delivery of finished packages
          # (Azure app registration with application-permission
          # Files.ReadWrite.All — see DEPLOY.md).
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          ONEDRIVE_USER: ${{ secrets.ONEDRIVE_USER }}
          ONEDRIVE_BASE_PATH: ${{ secrets.ONEDRIVE_BASE_PATH }}
        run: |
          set -e
          # Keep KDP Studio in its own Postgres schema so it can never touch
          # other tables living in the same database.
          case "$DATABASE_URL" in
            *schema=*) ;;
            *\?*) DATABASE_URL="${DATABASE_URL}&schema=kdp_studio" ;;
            *) DATABASE_URL="${DATABASE_URL}?schema=kdp_studio" ;;
          esac
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
          sync_env() {
            local name="$1" value="$2"
            if [ -n "$value" ]; then
              vercel env rm "$name" production --yes --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
              printf '%s' "$value" | vercel env add "$name" production --token "$VERCEL_TOKEN"
              echo "synced $name"
            else
              echo "skipping $name (secret not set)"
            fi
          }
          sync_env DATABASE_URL "$DATABASE_URL"
          sync_env OPENAI_API_KEY "$OPENAI_API_KEY"
          sync_env R2_ACCOUNT_ID "$R2_ACCOUNT_ID"
          sync_env R2_ACCESS_KEY_ID "$R2_ACCESS_KEY_ID"
          sync_env R2_SECRET_ACCESS_KEY "$R2_SECRET_ACCESS_KEY"
          sync_env R2_BUCKET "$R2_BUCKET"
          sync_env R2_PUBLIC_BASE_URL "$R2_PUBLIC_BASE_URL"
          sync_env ETSY_API_KEY "$ETSY_API_KEY"
          sync_env MS_TENANT_ID "$MS_TENANT_ID"
          sync_env MS_CLIENT_ID "$MS_CLIENT_ID"
          sync_env MS_CLIENT_SECRET "$MS_CLIENT_SECRET"
          sync_env ONEDRIVE_USER "$ONEDRIVE_USER"
          sync_env ONEDRIVE_BASE_PATH "$ONEDRIVE_BASE_PATH"

      - name: Ensure Blob storage for generated artwork
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if vercel env ls production --token "$VERCEL_TOKEN" 2>/dev/null | grep -q BLOB_READ_WRITE_TOKEN; then
            echo "Blob storage already connected."
          else
            # --yes links the new store to the project (provisions BLOB_READ_WRITE_TOKEN).
            # Note: an unlinked empty store "kdp-studio-images" from an earlier run may
            # remain in the account; it can be deleted from the dashboard.
            vercel blob create-store kdp-artwork --access public --yes --token "$VERCEL_TOKEN" 2>&1 || true
          fi
          echo "--- production env vars now configured:"
          vercel env ls production --token "$VERCEL_TOKEN" 2>&1 | sed 's/  */ /g' || true
          if ! vercel env ls production --token "$VERCEL_TOKEN" 2>/dev/null | grep -q BLOB_READ_WRITE_TOKEN; then
            echo "::warning::BLOB_READ_WRITE_TOKEN not present — connect the Blob store to the project in the Vercel dashboard (Storage tab)"
          fi

      - name: Deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -o pipefail
          vercel deploy --prod --yes --token "$VERCEL_TOKEN" 2>&1 | tee deploy-output.txt
          URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app' deploy-output.txt | tail -1)
          echo "### Deployed: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "PRODUCTION_URL=$URL"
